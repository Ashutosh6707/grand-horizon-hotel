<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e0a3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b20"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#162544"/>
      <stop offset="100%" stop-color="#0a1128"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2,3"/>
  <!-- Horizon Arch & Sun -->
  <path d="M 28 64 Q 50 36 72 64" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="45" r="7" fill="url(#goldGrad)"/>
  <!-- Stars -->
  <polygon points="50,22 52,27 57,28 53,31 54,36 50,33 46,36 47,31 43,28 48,27" fill="url(#goldGrad)"/>
  <!-- GH Monogram -->
  <text x="50" y="78" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">GH</text>
</svg>
